{% extends "base.html" %}

{% block title %}Admin Login - FinSakhi{% endblock %}

{% block content %}
<div class="container" style="padding-top: 40px; padding-bottom: 50px;">
  <div class="form-card" style="max-width: 460px; border-top: 4px solid var(--accent-green);">
    <div style="text-align: center; margin-bottom: 24px;">
      <span style="font-size: 2.2rem;">🔒</span>
      <h2 class="form-title" style="margin-top: 8px;">Administrator Portal</h2>
      <p class="form-subtitle">Restricted system access for portal managers and faculty review.</p>
    </div>

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label class="form-label" for="username">Admin Username *</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Admin Password *</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter administrative password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
        Authorize & Log In &rarr;
      </button>
    </form>

    <div style="margin-top: 20px; background: #faf8f5; border: 1px dashed #d8cfbe; padding: 10px 14px; border-radius: 6px; font-size: 0.8rem; color: #6c757d;">
      <strong>Default Admin Credentials:</strong> Username: <code>admin</code> | Password: <code>admin123</code>
    </div>
  </div>
</div>
{% endblock %}

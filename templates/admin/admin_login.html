{% extends "base.html" %}

{% block title %}Admin Login - FinSakhi{% endblock %}

{% block content %}
<div class="container" style="padding-top: 48px; padding-bottom: 60px;">
  <div class="form-card" style="max-width: 440px; border-top: 4px solid var(--accent-green);">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width:52px;height:52px;border-radius:50%;background:var(--light-green);display:flex;align-items:center;justify-content:center;margin:0 auto 14px auto;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 class="form-title" style="margin-top: 0;">Administrator Portal</h2>
      <p class="form-subtitle">Restricted access for authorized personnel only.</p>
    </div>

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter admin username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter admin password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 14px;">
        Authorize &amp; Log In
      </button>
    </form>
  </div>
</div>
{% endblock %}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="sakhiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="100%" stop-color="#40916c" />
    </linearGradient>
  </defs>

  <!-- Logo Icon: Rupee Coin Shield with Growth Sprout -->
  <g transform="translate(4, 5)">
    <!-- Base Circle / Coin Shield -->
    <circle cx="20" cy="20" r="19" fill="url(#sakhiGrad)" />
    <circle cx="20" cy="20" r="16.5" fill="none" stroke="#d8f3dc" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Rupee Symbol stylized inside coin -->
    <path d="M14 12 h12 M14 16 h10 M14 12 v16 M18 16 a4 4 0 0 0 0 -4 M17 19 l6 9" 
          stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Growth Sprout Leaf emerging from top right -->
    <path d="M26 12 C 26 4, 34 3, 34 3 C 34 3, 35 11, 26 12 Z" fill="url(#leafGrad)" />
    <path d="M22 10 C 22 5, 27 5, 27 5" fill="none" stroke="#52b788" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography: FinSakhi -->
  <text x="54" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#1b4332">Fin<tspan fill="#40916c">Sakhi</tspan></text>
  <!-- Micro subtext -->
  <text x="55" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.5" fill="#556b5d" letter-spacing="1.2">SMART RURAL FINANCE</text>
</svg>
